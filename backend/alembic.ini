# Alembic Configuration

[alembic]
# Path to migration scripts
script_location = alembic

# Template used for new migrations
# file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with current working directory
prepend_sys_path = .

# Timezone for migration timestamps
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run in "offline" mode
# offline = false

# Database URL — overridden by env.py from environment variable
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
